name: Update GitHub Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Generate Info Card
        run: python scripts/info_card.py

      - name: Generate ASCII SVG
        run: python scripts/make_ascii_svg.py

      - name: Generate Contribution Heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/contribution_heatmap.py

      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git add assets

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update profile assets"
            git push
          fi